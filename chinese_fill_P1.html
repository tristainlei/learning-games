<html lang="zh-HK">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;600;800&display=swap');
    body {
      font-family: 'Noto Sans TC', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }
    .blank-slot {
      min-width: 96px;
      height: 44px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-bottom: 3px solid #3b82f6;
      background-color: #eff6ff;
      border-radius: 8px 8px 0 0;
      margin: 0 6px;
      padding: 0 12px;
      cursor: pointer;
      transition: all 0.2s ease;
      font-weight: 700;
      color: #1e3a8a;
      vertical-align: middle;
    }
    .blank-slot:hover {
      background-color: #dbeafe;
    }
    .blank-slot.active {
      background-color: #fef08a;
      border-bottom-color: #eab308;
      box-shadow: 0 0 0 2px rgba(234, 179, 8, 0.4);
    }
    .blank-slot.correct {
      background-color: #dcfce7;
      border-bottom-color: #22c55e;
      color: #15803d;
    }
    .blank-slot.incorrect {
      background-color: #fee2e2;
      border-bottom-color: #ef4444;
      color: #b91c1c;
      animation: shake 0.3s;
    }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-4px); }
      75% { transform: translateX(4px); }
    }
    .word-chip {
      touch-action: manipulation;
      transition: all 0.15s ease-in-out;
    }
    .word-chip:active {
      transform: scale(0.95);
    }
    .word-chip.used {
      opacity: 0.35;
      background-color: #94a3b8 !important;
      cursor: not-allowed;
      border-color: #64748b !important;
      box-shadow: none !important;
    }
  </style>
</head>
<body class="bg-amber-50 text-slate-800 min-h-screen flex flex-col justify-between">

          { prefix: "2. 今天，老師給我們", suffix: "了一本有趣的圖書。", answer: "介紹" },
          { prefix: "3. 聖誕聯歡會時，同學們玩了很多集體", suffix: "。", answer: "遊戲" },
          { prefix: "4. 天氣轉冷了，我們要多穿衣服，不然就會", suffix: "。", answer: "生病" },
          { prefix: "5. 昨天我到奶奶家，她做了一頓", suffix: "的午餐給我吃。", answer: "豐盛" }
        ]
      },
      {
        id: 17,
        title: "第 17 組",
        words: ["馬路", "青草", "地面", "成績", "快樂"],
        questions: [
          { prefix: "1. 過", suffix: "時，我們要注意安全！", answer: "馬路" },
          { prefix: "2. 秋天到了，斜坡上的", suffix: "慢慢變黃了。", answer: "青草" },
          { prefix: "3. 大雨過後，街道上的", suffix: "變得十分濕滑。", answer: "地面" },
          { prefix: "4. 我希望在這次比賽中拿到好", suffix: "。", answer: "成績" },
          { prefix: "5. 鳥兒每天在樹上唱歌，十分", suffix: "。", answer: "快樂" }
        ]
      },
      {
        id: 18,
        title: "第 18 組 · 小羊故事篇",
        words: ["渴", "到處", "漸漸", "終於", "喝水"],
        questions: [
          { prefix: "1. 小羊已經三天沒有東西吃了，又餓又", suffix: "。", answer: "渴" },
          { prefix: "2. 牠走遍山頭，", suffix: "尋找食物。", answer: "到處" },
          { prefix: "3. 走着走着，牠", suffix: "沒有力氣了，愈走愈慢。", answer: "漸漸" },
          { prefix: "4. 牠看到遠處有小河，開心地喊道：「太好了，", suffix: "有水喝了！」", answer: "終於" },
          { prefix: "5. 口渴的小羊急忙跑到河邊大口大口地", suffix: "。", answer: "喝水" }
        ]
      },
      {
        id: 19,
        title: "第 19 組 · 詞彙精選複習",
        words: ["安靜", "學生", "消息", "粗壯", "氣球"],
        questions: [
          { prefix: "1. 在圖書館內，我們必須保持", suffix: "，不要喧嘩。", answer: "安靜" },
          { prefix: "2. 學校裏每一位", suffix: "都穿著整齊的校服。", answer: "學生" },
          { prefix: "3. 老師帶來了一個好", suffix: "，下週五是旅行日！", answer: "消息" },
          { prefix: "4. 校園裏有幾棵", suffix: "的大樹，枝葉茂盛。", answer: "粗壯" },
          { prefix: "5. 妹妹手裏牽著五顏六色的", suffix: "，走在公園裏。", answer: "氣球" }
        ]
      }
    ];

    let currentGroupIndex = 0;
    let userAnswers = {}; // { 0..4: word }
    let activeBlankIndex = 0;
    let toastTimeout = null;

    // 自訂訊息框（不使用原生 alert）
    function showToast(text, isError = false) {
      const toast = document.getElementById('toast-message');
      const toastText = document.getElementById('toast-text');
      const toastIcon = document.getElementById('toast-icon');

      if (toastTimeout) clearTimeout(toastTimeout);

      toastText.innerText = text;
      if (isError) {
        toastIcon.className = "fa-solid fa-triangle-exclamation text-rose-400";
      } else {
        toastIcon.className = "fa-solid fa-circle-info text-amber-400";
      }

      toast.classList.remove('hidden');
      toastTimeout = setTimeout(() => {
        toast.classList.add('hidden');
      }, 2500);
    }

    // 音效效果 (Web Audio API)
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playTone(freq, type, duration) {
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    }

    function playSuccessSound() {
      playTone(523.25, 'triangle', 0.18);
      setTimeout(() => playTone(659.25, 'triangle', 0.18), 120);
      setTimeout(() => playTone(783.99, 'triangle', 0.3), 240);
    }

    function playErrorSound() {
      playTone(220, 'sine', 0.22);
    }

    // 將生詞數組打亂，並確保不與原答案順序相同
    function shuffleWordsNotMatchingAnswers(words, questions) {
      const originalAnswers = questions.map(q => q.answer);
      let shuffled = [...words];

      // Fisher-Yates 洗牌算法
      const shuffle = (arr) => {
        for (let i = arr.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
      };

      // 至少洗牌一次，並循環檢查是否與題目的答案順序完全一致
      let attempts = 0;
      do {
        shuffled = shuffle([...words]);
        attempts++;
        // 檢查是否完全與題目答案順序相同
        const isIdenticalOrder = shuffled.every((w, idx) => w === originalAnswers[idx]);
        if (!isIdenticalOrder) {
          break;
        }
      } while (attempts < 20);

      return shuffled;
    }

    // 初始化與加載特定組
    function loadGroup(index) {
      currentGroupIndex = index;
      userAnswers = {};
      activeBlankIndex = 0;

      const group = groupsData[currentGroupIndex];

      // 更新頂部資訊
      document.getElementById('current-level-title').innerText = group.title;
      document.getElementById('badge-level').innerText = `第 ${group.id} 組 / ${groupsData.length}`;
      document.getElementById('total-groups-count').innerText = groupsData.length;

      // 更新進度
      updateProgress();

      // 打亂生詞排序，確保不與答案順序相同
      const displayWords = shuffleWordsNotMatchingAnswers(group.words, group.questions);

      // 渲染打亂後的詞語庫（每組固定 5 個詞）
      renderWordBank(displayWords);

      // 渲染 5 題填充
      renderQuestions(group.questions);

      // 渲染選組彈窗按鈕
      renderLevelGrid();
    }

    function renderWordBank(words) {
      const container = document.getElementById('word-bank');
      container.innerHTML = '';

      words.forEach(word => {
        const btn = document.createElement('button');
        btn.className = `word-chip bg-white text-slate-800 font-bold px-4 py-2 rounded-xl border-2 border-amber-300 shadow-sm hover:border-blue-500 hover:bg-blue-50 hover:text-blue-600 text-base md:text-lg`;
        btn.innerText = word;
        btn.dataset.word = word;
        btn.onclick = () => onSelectWord(word);
        container.appendChild(btn);
      });
      updateWordChipsStatus();
    }

    function renderQuestions(questions) {
      const container = document.getElementById('questions-list');
      container.innerHTML = '';

      questions.forEach((q, idx) => {
        const item = document.createElement('div');
        item.className = 'flex items-center flex-wrap p-2.5 hover:bg-slate-50 rounded-xl transition border border-transparent hover:border-slate-100';

        const prefix = document.createElement('span');
        prefix.innerText = q.prefix;
        item.appendChild(prefix);

        const slot = document.createElement('span');
        slot.className = `blank-slot ${activeBlankIndex === idx ? 'active' : ''}`;
        slot.dataset.index = idx;
        slot.id = `blank-slot-${idx}`;
        slot.innerText = userAnswers[idx] || `( ${idx + 1} )`;
        if (!userAnswers[idx]) {
          slot.classList.add('text-slate-300');
        }

        slot.onclick = () => {
          if (userAnswers[idx]) {
            // 清除已填
            delete userAnswers[idx];
            slot.innerText = `( ${idx + 1} )`;
            slot.classList.add('text-slate-300');
            slot.classList.remove('correct', 'incorrect');
            activeBlankIndex = idx;
            highlightActiveSlot();
            updateWordChipsStatus();
            updateProgress();
          } else {
            activeBlankIndex = idx;
            highlightActiveSlot();
          }
        };

        item.appendChild(slot);

        const suffix = document.createElement('span');
        suffix.innerText = q.suffix;
        item.appendChild(suffix);

        container.appendChild(item);
      });
    }

    function highlightActiveSlot() {
      const slots = document.querySelectorAll('.blank-slot');
      slots.forEach(slot => {
        const idx = parseInt(slot.dataset.index);
        if (idx === activeBlankIndex) {
          slot.classList.add('active');
        } else {
          slot.classList.remove('active');
        }
      });
    }

    function onSelectWord(word) {
      // 5 題固定
      const total = 5;

      // 如果當前槽位已填，自動找第一個空格
      if (userAnswers[activeBlankIndex] !== undefined) {
        let nextEmpty = -1;
        for (let i = 0; i < total; i++) {
          if (!userAnswers[i]) {
            nextEmpty = i;
            break;
          }
        }
        if (nextEmpty !== -1) {
          activeBlankIndex = nextEmpty;
        }
      }

      // 填入
      userAnswers[activeBlankIndex] = word;
      const slot = document.getElementById(`blank-slot-${activeBlankIndex}`);
      if (slot) {
        slot.innerText = word;
        slot.classList.remove('text-slate-300', 'correct', 'incorrect');
      }

      // 自動跳往下一空格
      let nextEmpty = -1;
      for (let i = 0; i < total; i++) {
        if (!userAnswers[i]) {
          nextEmpty = i;
          break;
        }
      }
      activeBlankIndex = nextEmpty !== -1 ? nextEmpty : activeBlankIndex;

      highlightActiveSlot();
      updateWordChipsStatus();
      updateProgress();
      playTone(480, 'sine', 0.08);
    }

    function updateWordChipsStatus() {
      const usedWords = Object.values(userAnswers);
      const chips = document.querySelectorAll('.word-chip');
      chips.forEach(chip => {
        const word = chip.dataset.word;
        const countUsed = usedWords.filter(w => w === word).length;
        if (countUsed > 0) {
          chip.classList.add('used');
        } else {
          chip.classList.remove('used');
        }
      });
    }

    function updateProgress() {
      const total = 5;
      const filledCount = Object.keys(userAnswers).length;

      document.getElementById('progress-text').innerText = `${filledCount} / ${total}`;
      const pct = (filledCount / total) * 100;
      document.getElementById('progress-bar').style.width = `${pct}%`;
    }

    function checkAnswers() {
      const group = groupsData[currentGroupIndex];
      let allCorrect = true;
      let unanswered = 0;

      for (let i = 0; i < 5; i++) {
        const expected = group.questions[i].answer;
        const slot = document.getElementById(`blank-slot-${i}`);
        const userAns = userAnswers[i];

        if (!userAns) {
          unanswered++;
          allCorrect = false;
          slot.classList.remove('correct');
          slot.classList.add('incorrect');
        } else if (userAns === expected) {
          slot.classList.remove('incorrect');
          slot.classList.add('correct');
        } else {
          allCorrect = false;
          slot.classList.remove('correct');
          slot.classList.add('incorrect');
        }
      }

      if (allCorrect) {
        playSuccessSound();
        triggerConfetti();
        document.getElementById('success-dialog').classList.remove('hidden');
      } else {
        playErrorSound();
        if (unanswered > 0) {
          showToast(`還有 ${unanswered} 題未填，紅框需要再想想喔！`, true);
        } else {
          showToast('部分答案不太正確，檢查一下紅色的格子吧！', true);
        }
      }
    }

    function triggerConfetti() {
      confetti({
        particleCount: 70,
        spread: 60,
        origin: { y: 0.6 }
      });
    }

    function closeSuccessDialog() {
      document.getElementById('success-dialog').classList.add('hidden');
    }

    function prevLevel() {
      if (currentGroupIndex > 0) {
        closeSuccessDialog();
        loadGroup(currentGroupIndex - 1);
      } else {
        showToast('已經是第 1 組囉！');
      }
    }

    function nextLevel() {
      if (currentGroupIndex < groupsData.length - 1) {
        closeSuccessDialog();
        loadGroup(currentGroupIndex + 1);
      } else {
        showToast('🎉 恭喜！你已經完成了全部 19 組供詞填充練習！');
      }
    }

    function resetCurrentLevel() {
      loadGroup(currentGroupIndex);
    }

    function toggleLevelModal() {
      const modal = document.getElementById('level-modal');
      modal.classList.toggle('hidden');
    }

    function renderLevelGrid() {
      const grid = document.getElementById('level-grid-buttons');
      grid.innerHTML = '';
      groupsData.forEach((grp, idx) => {
        const btn = document.createElement('button');
        const isActive = idx === currentGroupIndex;
        btn.className = `py-2.5 px-2 rounded-xl text-center font-bold text-sm transition ${
          isActive 
            ? 'bg-blue-600 text-white shadow-md shadow-blue-500/40 ring-2 ring-blue-300' 
            : 'bg-slate-100 hover:bg-slate-200 text-slate-700'
        }`;
        btn.innerText = `第 ${grp.id} 組`;
        btn.onclick = () => {
          loadGroup(idx);
          toggleLevelModal();
        };
        grid.appendChild(btn);
      });
    }

    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        document.getElementById('level-modal').classList.add('hidden');
        closeSuccessDialog();
      }
    });

    window.onload = () => {
      loadGroup(0);
    };
  </script>
</body>
